[project]
name = "saebench-audit"
version = "0.1.0"
description = "Code for the paper: How Reliable Are Sparse Autoencoder Benchmarks?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sae-lens>=6.37",
    "sae-bench>=0.5",
    "sae-probes>=0.1",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
    "torch>=2.4",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "transformer-lens>=2.0,<3",
]

[dependency-groups]
dev = ["pyright>=1.1.409", "pytest>=9.0.3", "ruff>=0.15.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saebench_audit"]
artifacts = [
    "saebench_audit/synthetic/paper_fixtures/**/*.json",
]

[tool.ruff]
exclude = [".venv", "*.ipynb", "dist"]

[tool.ruff.lint]
ignore = ["E203", "E501", "E731"]
extend-select = ["UP", "TID", "I", "F", "E", "ARG"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.Tuple".msg = "Use `tuple` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
